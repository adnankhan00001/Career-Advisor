version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: careeradvisor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-career_advisor}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass123}
      MYSQL_USER: ${DB_USERNAME:-advisor_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-advisor_pass123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careeradvisor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeradvisor-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-career_advisor}
      DB_USERNAME: ${DB_USERNAME:-advisor_user}
      DB_PASSWORD: ${DB_PASSWORD:-advisor_pass123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@careeradvisor.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - careeradvisor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: careeradvisor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - careeradvisor-network

volumes:
  mysql_prod_data:
    driver: local

networks:
  careeradvisor-network:
    driver: bridge
