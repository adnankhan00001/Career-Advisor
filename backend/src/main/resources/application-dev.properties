# ============================================================
# Development Profile (application-dev.properties)
# ============================================================

# Database Configuration with Local Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:career_advisor}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Development Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Development Defaults)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Local Next.js dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Development Administrator Bootstrapping
app.admin.email=${ADMIN_EMAIL:admin@careeradvisor.dev}
app.admin.password=${ADMIN_PASSWORD:AdminPass123!}
app.admin.name=${ADMIN_NAME:System Administrator}

# AI Development Configuration (Defaults to Mock Provider)
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}

# Logging Configuration
logging.level.com.careeradvisor=INFO
logging.level.org.springframework.security=INFO
