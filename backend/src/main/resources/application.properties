spring.application.name=career-advisor

# Default active profile is 'dev' for local developer convenience
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common Server Configuration
server.port=${PORT:8080}

# Common Database Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Common Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart File Upload Defaults
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# AI Infrastructure Configuration
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.base-url=${AI_BASE_URL:}
app.ai.max-tokens=${AI_MAX_TOKENS:1000}
app.ai.temperature=${AI_TEMPERATURE:0.7}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.chat.max-message-length=${AI_CHAT_MAX_MESSAGE_LENGTH:4000}
app.ai.chat.history-limit=${AI_CHAT_HISTORY_LIMIT:20}
app.ai.chat.title-max-length=${AI_CHAT_TITLE_MAX_LENGTH:80}
app.ai.chat.enabled=${AI_CHAT_ENABLED:true}

# WebRTC Signaling & ICE Configuration
app.webrtc.stun.url=${WEBRTC_STUN_URL:stun:stun.l.google.com:19302}
app.webrtc.turn.url=${WEBRTC_TURN_URL:}
app.webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
app.webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}
app.webrtc.call.ringing-timeout-seconds=${WEBRTC_CALL_TIMEOUT:45}