# ============================================================
# Production Profile (application-prod.properties)
# ============================================================

# Database Configuration (Environment-Driven, supporting Railway MySQL, Spring standard, or individual vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:career_advisor}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:}}}

# JPA Production Settings (Validate schema; do not mutate in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Environment Variables with fallback)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production CORS Configuration (Supports exact domains and Vercel wildcards)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:3000}

# Production Administrator Configuration (Environment-Driven)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Administrator}

# Production AI Configuration (Environment-Driven)
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.base-url=${AI_BASE_URL:}
app.ai.max-tokens=${AI_MAX_TOKENS:1000}
app.ai.temperature=${AI_TEMPERATURE:0.7}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.chat.max-message-length=${AI_CHAT_MAX_MESSAGE_LENGTH:4000}
app.ai.chat.history-limit=${AI_CHAT_HISTORY_LIMIT:20}
app.ai.chat.title-max-length=${AI_CHAT_TITLE_MAX_LENGTH:80}
app.ai.chat.enabled=${AI_CHAT_ENABLED:true}

# Production Logging Configuration (Safe, Minimal, No Secrets)
logging.level.com.careeradvisor=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
