# ============================================================
# Production Profile (application-prod.properties)
# ============================================================

# Database Configuration (Environment-Driven)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:career_advisor}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Production Settings (Validate schema; do not mutate in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Mandatory Environment Variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production CORS Configuration (Strict Whitelist)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://careeradvisor.dev}

# Production Administrator Configuration (Environment-Driven)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Administrator}

# Production AI Configuration (Environment-Driven)
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.base-url=${AI_BASE_URL:}
app.ai.max-tokens=${AI_MAX_TOKENS:1000}
app.ai.temperature=${AI_TEMPERATURE:0.7}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Production Logging Configuration (Safe, Minimal, No Secrets)
logging.level.com.careeradvisor=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
